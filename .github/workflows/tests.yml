name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gut:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          # Los PNG y WAV van en Git LFS: sin ellos los tests de arte fallan.
          lfs: true
      - name: Instalar Godot
        run: |
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Tests GUT
        run: tools/test.sh
      - name: Banco de chunks (aviso, nunca falla)
        # ADR 0014 §6: mediana y p95 de 50 chunks, seed 42. Las máquinas de CI varían.
        continue-on-error: true
        run: '"$GODOT" --headless --path . -s tools/world/bench_chunks.gd'
      - name: Banco del ChunkBuilder del Mundo 2.0 (aviso, nunca falla)
        # M9: la región entera (192 chunks), mediana, p95 y ms por fase. Objetivo en el PC de
        # referencia: mediana <= 80 ms y p95 <= 150 ms. Nunca falla: si el banco no termina, avisa.
        continue-on-error: true
        run: |
          timeout 600 "$GODOT" --headless --path . -s tools/world/bench_chunks.gd -- --builder=world --count=192 --profile \
            || echo "::warning::bench_chunks --builder=world no terminó (código $?)"
